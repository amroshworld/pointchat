name: iOS Release Build & Upload

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build_ios:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Install CocoaPods
        run: |
          sudo gem install cocoapods
          cd ios
          pod install --repo-update

      # -----------------------------
      #  SIGNING SETUP
      # -----------------------------
      # Repo-first signing:
      #   Preferred: commit raw files under ios/ci/ in this private repo.
      #   Fallback: .b64 repo files.
      #   Last fallback: GitHub secrets.
      - name: Load repo signing config
        run: |
          set -euo pipefail
          if [ -f ios/ci/signing.env ]; then
            cat ios/ci/signing.env >> "$GITHUB_ENV"
          fi

      - name: Decode signing certificate
        env:
          CERT_P12_B64_SECRET: ${{ secrets.CERTIFICATE_P12 }}
        run: |
          set -euo pipefail
          if [ -f ios/ci/certificate.p12 ]; then
            cp ios/ci/certificate.p12 certificate.p12
          elif [ -f ios/ci/certificate.p12.b64 ]; then
            python3 ios/ci/decode_signing_assets.py p12 certificate.p12 --file ios/ci/certificate.p12.b64
          else
            python3 ios/ci/decode_signing_assets.py p12 certificate.p12 --env-var CERT_P12_B64_SECRET
          fi
          test -s certificate.p12

      - name: Decode provisioning profile
        env:
          PROFILE_B64_SECRET: ${{ secrets.PROVISIONING_PROFILE }}
        run: |
          set -euo pipefail
          if [ -f ios/ci/profile.mobileprovision ]; then
            cp ios/ci/profile.mobileprovision profile.mobileprovision
          elif [ -f ios/ci/profile.mobileprovision.b64 ]; then
            python3 ios/ci/decode_signing_assets.py profile profile.mobileprovision --file ios/ci/profile.mobileprovision.b64
          else
            python3 ios/ci/decode_signing_assets.py profile profile.mobileprovision --env-var PROFILE_B64_SECRET
          fi
          test -s profile.mobileprovision

      - name: Create keychain and import certificate
        env:
          CERT_PASSWORD_SECRET: ${{ secrets.CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          CERT_PASSWORD="${CERTIFICATE_PASSWORD:-$CERT_PASSWORD_SECRET}"
          test -n "$CERT_PASSWORD" || { echo "::error::Missing CERTIFICATE_PASSWORD. Put it in ios/ci/signing.env or GitHub secret."; exit 1; }
          KEYCHAIN_PATH="$RUNNER_TEMP/build-signing.keychain"
          security create-keychain -p "" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 3600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "" "$KEYCHAIN_PATH"
          # -A: allow codesign to use the private key non-interactively (common on CI)
          security import certificate.p12 -k "$KEYCHAIN_PATH" -P "$CERT_PASSWORD" -A -T /usr/bin/codesign -T /usr/bin/security
          security list-keychains -d user -s "$KEYCHAIN_PATH" "$HOME/Library/Keychains/login.keychain-db"
          security default-keychain -s "$KEYCHAIN_PATH"

      - name: Install provisioning profile
        run: |
          set -euo pipefail
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          UUID=$(grep -aEo '[0-9A-F]{8}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{12}' profile.mobileprovision | head -1)
          test -n "$UUID" || { echo "::error::Could not extract UUID from profile.mobileprovision"; exit 1; }
          cp profile.mobileprovision "$HOME/Library/MobileDevice/Provisioning Profiles/${UUID}.mobileprovision"

      # -----------------------------
      #  BUILD IPA
      # -----------------------------
      - name: Build iOS IPA (Release)
        run: |
          flutter build ipa --release --export-options-plist=ios/ExportOptions.plist

      # -----------------------------
      #  FASTLANE UPLOAD
      # -----------------------------
      - name: Install Fastlane
        run: sudo gem install fastlane

      - name: Create App Store Connect API key
        env:
          ASC_KEY_B64_SECRET: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p fastlane
          if [ -f ios/ci/AuthKey.p8 ]; then
            cp ios/ci/AuthKey.p8 fastlane/AuthKey.p8
          elif [ -f ios/ci/AuthKey.p8.b64 ]; then
            python3 -c "import base64,re,pathlib; raw=pathlib.Path('ios/ci/AuthKey.p8.b64').read_text(encoding='utf-8', errors='replace').lstrip('\ufeff'); compact=re.sub(r'\s+','',raw); compact += '='*((-len(compact))%4); pathlib.Path('fastlane/AuthKey.p8').write_bytes(base64.b64decode(compact))"
          else
            printf '%s' "$ASC_KEY_B64_SECRET" | tr -d '\r\n' | base64 -d > fastlane/AuthKey.p8
          fi
          test -s fastlane/AuthKey.p8

      - name: Upload to App Store Connect
        env:
          ASC_KEY_ID_SECRET: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID_SECRET: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail
          ASC_KEY_ID="${APP_STORE_CONNECT_KEY_ID:-$ASC_KEY_ID_SECRET}"
          ASC_ISSUER_ID="${APP_STORE_CONNECT_ISSUER_ID:-$ASC_ISSUER_ID_SECRET}"
          test -n "$ASC_KEY_ID" || { echo "::error::Missing APP_STORE_CONNECT_KEY_ID. Put it in ios/ci/signing.env or GitHub secret."; exit 1; }
          test -n "$ASC_ISSUER_ID" || { echo "::error::Missing APP_STORE_CONNECT_ISSUER_ID. Put it in ios/ci/signing.env or GitHub secret."; exit 1; }
          fastlane deliver \
            --api_key_path fastlane/AuthKey.p8 \
            --api_key_id "$ASC_KEY_ID" \
            --api_issuer_id "$ASC_ISSUER_ID" \
            --ipa "build/ios/ipa/*.ipa" \
            --skip_screenshots \
            --skip_metadata \
            --skip_app_version_update \
            --force
