name: iOS Release Build & Upload

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build_ios:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Install CocoaPods
        run: |
          sudo gem install cocoapods
          cd ios
          pod install --repo-update

      # -----------------------------
      #  SIGNING SETUP
      # -----------------------------
      # Secrets must be base64 of the *binary* .p12 / .mobileprovision (not PEM text).
      # Use: base64 -i YourCert.p12 | pbcopy   then paste into CERTIFICATE_P12 secret.
      # Avoid `echo "$SECRET" | base64` — echo can add a newline and corrupt the file.
      - name: Decode signing certificate
        env:
          CERT_P12_B64: ${{ secrets.CERTIFICATE_P12 }}
          CERT_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          printf '%s' "$CERT_P12_B64" | tr -d '\r\n' | base64 -d > certificate.p12
          test -s certificate.p12
          openssl pkcs12 -in certificate.p12 -nokeys -passin pass:"$CERT_PASSWORD" -out /dev/null 2>/dev/null \
            || { echo "::error::certificate.p12 is not valid PKCS#12, or CERTIFICATE_PASSWORD is wrong. Store GitHub secret CERTIFICATE_P12 as base64 of the binary .p12 only (not PEM text). macOS: base64 -i cert.p12 | pbcopy"; exit 1; }

      - name: Decode provisioning profile
        env:
          PROFILE_B64: ${{ secrets.PROVISIONING_PROFILE }}
        run: |
          set -euo pipefail
          printf '%s' "$PROFILE_B64" | tr -d '\r\n' | base64 -d > profile.mobileprovision
          test -s profile.mobileprovision

      - name: Create keychain and import certificate
        env:
          CERT_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          # Same path for create + import (create-keychain in CWD is NOT ~/Library/Keychains/build.keychain)
          KEYCHAIN_PATH="$RUNNER_TEMP/build-signing.keychain"
          security create-keychain -p "" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 3600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "" "$KEYCHAIN_PATH"
          security import certificate.p12 -k "$KEYCHAIN_PATH" -P "$CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security list-keychains -d user -s "$KEYCHAIN_PATH" "$HOME/Library/Keychains/login.keychain-db"
          security default-keychain -s "$KEYCHAIN_PATH"

      - name: Install provisioning profile
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/

      # -----------------------------
      #  BUILD IPA
      # -----------------------------
      - name: Build iOS IPA (Release)
        run: |
          flutter build ipa --release --export-options-plist=ios/ExportOptions.plist

      # -----------------------------
      #  FASTLANE UPLOAD
      # -----------------------------
      - name: Install Fastlane
        run: sudo gem install fastlane

      - name: Create App Store Connect API key
        run: |
          mkdir -p fastlane
          echo "${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}" | base64 --decode > fastlane/AuthKey.p8

      - name: Upload to App Store Connect
        run: |
          fastlane deliver \
            --api_key_path fastlane/AuthKey.p8 \
            --api_key_id "${{ secrets.APP_STORE_CONNECT_KEY_ID }}" \
            --api_issuer_id "${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}" \
            --ipa "build/ios/ipa/*.ipa" \
            --skip_screenshots \
            --skip_metadata \
            --skip_app_version_update \
            --force
