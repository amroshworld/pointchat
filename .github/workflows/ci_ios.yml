name: iOS Release Build & Upload

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build_ios:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.22.0"

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Install CocoaPods
        run: |
          sudo gem install cocoapods
          cd ios
          pod install --repo-update

      # -----------------------------
      #  SIGNING SETUP
      # -----------------------------
      - name: Decode signing certificate
        run: |
          echo "${{ secrets.CERTIFICATE_P12 }}" | base64 --decode > certificate.p12

      - name: Decode provisioning profile
        run: |
          echo "${{ secrets.PROVISIONING_PROFILE }}" | base64 --decode > profile.mobileprovision

      - name: Create keychain and import certificate
        run: |
          security create-keychain -p "" build.keychain
          security import certificate.p12 -k ~/Library/Keychains/build.keychain -P "${{ secrets.CERTIFICATE_PASSWORD }}" -T /usr/bin/codesign
          security list-keychains -s ~/Library/Keychains/build.keychain
          security default-keychain -s ~/Library/Keychains/build.keychain
          security unlock-keychain -p "" ~/Library/Keychains/build.keychain
          security set-keychain-settings -t 3600 -u ~/Library/Keychains/build.keychain

      - name: Install provisioning profile
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/

      # -----------------------------
      #  BUILD IPA
      # -----------------------------
      - name: Build iOS IPA (Release)
        run: |
          flutter build ipa --release --export-options-plist=ios/ExportOptions.plist

      # -----------------------------
      #  FASTLANE UPLOAD
      # -----------------------------
      - name: Install Fastlane
        run: sudo gem install fastlane

      - name: Create App Store Connect API key
        run: |
          mkdir -p fastlane
          echo "${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}" | base64 --decode > fastlane/AuthKey.p8

      - name: Upload to App Store Connect
        run: |
          fastlane deliver \
            --api_key_path fastlane/AuthKey.p8 \
            --api_key_id "${{ secrets.APP_STORE_CONNECT_KEY_ID }}" \
            --api_issuer_id "${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}" \
            --ipa "build/ios/ipa/*.ipa" \
            --skip_screenshots \
            --skip_metadata \
            --skip_app_version_update \
            --force
