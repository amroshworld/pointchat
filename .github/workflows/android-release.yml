name: Android Release Build

on:
  push:
    branches:
      - "**"

jobs:
  build-android-release:
    name: Build Android Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Build Android APK (Release)
        run: flutter build apk --release --build-number=${{ github.run_number }}

      - name: Rename APK with version info
        run: |
          mkdir -p artifacts
          APK_FILE=$(find build/app/outputs/flutter-apk -name "*.apk" | head -1)
          cp "$APK_FILE" artifacts/pointchat-release-${{ github.run_number }}.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: pointchat-android-release-${{ github.run_number }}
          path: artifacts/pointchat-release-${{ github.run_number }}.apk
          if-no-files-found: error

      - name: Generate build summary
        run: |
          echo "### 🚀 Android Release Build Complete!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Build Number:** ${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📱 Download the APK from the **Artifacts** section above to install on your Android device." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Installation Instructions:**" >> $GITHUB_STEP_SUMMARY
          echo "1. Download the APK artifact from this workflow run" >> $GITHUB_STEP_SUMMARY
          echo "2. Extract the ZIP file to get the APK" >> $GITHUB_STEP_SUMMARY
          echo "3. Transfer the APK to your Android device" >> $GITHUB_STEP_SUMMARY
          echo "4. Enable 'Install from Unknown Sources' in your device settings" >> $GITHUB_STEP_SUMMARY
          echo "5. Open the APK file on your device to install" >> $GITHUB_STEP_SUMMARY
