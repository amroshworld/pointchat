# Signed Android AAB + unsigned iOS app (same triggers). Secrets: see docs/RELEASE_PLAY_APPSTORE.md
name: Mobile Release (Android AAB + iOS)

on:
  workflow_dispatch:
    inputs:
      track:
        description: "Play track (for your notes; upload to Play is still manual)"
        required: true
        default: "internal"
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production
  push:
    tags:
      - "v*"

jobs:
  build-aab:
    name: Android — signed AAB
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Decode keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > ${{ runner.temp }}/upload-keystore.jks

      - name: Write key.properties
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=${{ runner.temp }}/upload-keystore.jks
          EOF

      - name: Flutter pub get
        run: flutter pub get

      - name: Build AAB
        env:
          REVENUECAT_ANDROID_API_KEY: ${{ secrets.REVENUECAT_ANDROID_API_KEY }}
          REVENUECAT_IOS_API_KEY: ${{ secrets.REVENUECAT_IOS_API_KEY }}
        run: |
          flutter build appbundle --release \
            --build-number=${{ github.run_number }} \
            --dart-define=REVENUECAT_ANDROID_API_KEY=${REVENUECAT_ANDROID_API_KEY} \
            --dart-define=REVENUECAT_IOS_API_KEY=${REVENUECAT_IOS_API_KEY}

      - uses: actions/upload-artifact@v4
        with:
          name: pointchat-release-aab
          path: build/app/outputs/bundle/release/*.aab
          if-no-files-found: error

  build-ios-unsigned:
    name: iOS — release (no codesign)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Build iOS (no codesign)
        env:
          REVENUECAT_ANDROID_API_KEY: ${{ secrets.REVENUECAT_ANDROID_API_KEY }}
          REVENUECAT_IOS_API_KEY: ${{ secrets.REVENUECAT_IOS_API_KEY }}
        run: |
          flutter build ios --release --no-codesign --build-number=${{ github.run_number }} \
            --dart-define=REVENUECAT_ANDROID_API_KEY=${REVENUECAT_ANDROID_API_KEY} \
            --dart-define=REVENUECAT_IOS_API_KEY=${REVENUECAT_IOS_API_KEY}

      - name: Zip Runner.app
        run: |
          cd build/ios/iphoneos
          zip -r Runner.app.zip Runner.app

      - uses: actions/upload-artifact@v4
        with:
          name: pointchat-ios-unsigned-app
          path: build/ios/iphoneos/Runner.app.zip
          if-no-files-found: error
